name: Run Military R&D Agent

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger execution

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 # Fetches full history so tracking works perfectly

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Agent
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }} 
      run: python agent.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Pull latest changes to avoid out-of-sync branch issues
        git pull origin main --rebase
        
        # Only attempt to track data.json if it exists
        if [ -f data.json ]; then
          git add data.json
          
          # Check if there are actual modifications to save
          if git diff-index --quiet HEAD --; then
            echo "No new updates found by the agent. Skipping commit."
          else
            git commit -m "Automated Agent Update: $(date -u)"
            git push origin HEAD:main
          fi
        else
          echo "Error: data.json was not generated by agent.py"
          exit 1
        fi
