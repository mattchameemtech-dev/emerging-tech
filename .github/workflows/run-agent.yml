name: Run Military R&D Agent

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger execution

# 1. Explicitly grant write access to the runner framework
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # 2. Authenticate using the built-in system authorization token
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Agent
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }} 
      run: python agent.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git diff-index --quiet HEAD || (git commit -m "Automated Agent Update: $(date -u)" && git push)
